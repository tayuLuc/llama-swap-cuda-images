<text x="240" y="170" font-size="13" font-weight="500" fill="#8b949e">nightly = branch HEAD</text>
<text x="240" y="190" font-size="13" font-weight="500" fill="#d29922">dedup: nightly == stable: skip</text>
<text x="240" y="210" font-size="13" font-weight="500" fill="#d29922">moving-tag lanes: nightly_always</text>
