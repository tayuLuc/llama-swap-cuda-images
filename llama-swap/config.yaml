# llama-swap config.
#
# Schema note: llama-swap v262 requires `models` to be a MAP keyed by model ID.
# The previous list form (`- name: ".*"`) is rejected outright:
#   yaml: unmarshal errors: cannot unmarshal !!seq into map[string]config.modelMacroConfig
# The image pins no llama-swap version - FROM ghcr.io/mostlygeek/llama-swap:cpu is
# a moving tag - so an upgrade invalidated this config with no build failure.
#
# There is no regex catch-all any more: `cmd` takes a literal model path, so every
# model is declared here. `${models_dir}` is a macro resolved from the environment,
# which keeps one image usable against any host models directory.
#
# Backends:
#   /opt/llama/<fork>/llama-server   llama.cpp forks, GGUF
#   /opt/llama/imp/imp-server        imp, safetensors checkpoints (NVFP4/FP8)

macros:
  models_dir: "${env.MODELS_DIR:-/models}"

models:
  # ---- imp: safetensors checkpoints -----------------------------------------
  # imp is not a llama.cpp fork: own binary, own flags, own model formats.
  "qwen3.8-flash-next-nvfp4":
    cmd: |
      /opt/llama/imp/imp-server
      --model ${models_dir}/qwen3.8-flash-next-nvfp4
      --port ${PORT}
      --gpu-layers -1
    name: "Qwen3.8-Flash-Next NVFP4 (imp)"

  # ---- llama.cpp forks: GGUF ------------------------------------------------
  "turboquant-kv":
    cmd: |
      /opt/llama/turboquant/llama-server
      --model ${models_dir}/qwen3.8-flash-next-ud-iq4xs.gguf
      --port ${PORT}
      -ngl 999
      --cache-type-k turbo3
      --cache-type-v turbo3
    name: "TurboQuant KV-cache"

  "prism-ternary":
    cmd: |
      /opt/llama/prism/llama-server
      --model ${models_dir}/qwen3.8-flash-next-ud-iq4xs.gguf
      --port ${PORT}
      -ngl 999
    name: "Prism ternary (Q2_0)"

  "atomic":
    cmd: |
      /opt/llama/atomic/llama-server
      --model ${models_dir}/qwen3.8-flash-next-ud-iq4xs.gguf
      --port ${PORT}
      -ngl 999
    name: "Atomic fork"

  "default":
    cmd: |
      /opt/llama/vanilla/llama-server
      --model ${models_dir}/qwen3.8-flash-next-ud-iq4xs.gguf
      --port ${PORT}
      -ngl 999
    name: "vanilla llama.cpp (stable)"