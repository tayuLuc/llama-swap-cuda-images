name: Build llama-swap CUDA image

# Builds the llama-swap Docker image bundling ALL 4 llama.cpp forks + imp + Infernix
# + Basalt (vanilla + turboquant + prism + atomic) for CUDA 13.4 / RTX 5090 (sm_120).
#
# Triggered by:
#   - workflow_dispatch with `mode` (stable|nightly)  — fired from the source
#     repo's release job whenever a fork update is detected.
#   - optionally: schedule (nightly rebuild) and manual dispatch.
#
# Images pushed to GHCR:
#   ghcr.io/tayuLuc/llama-swap-cuda-images:stable          (moving alias)
#   ghcr.io/tayuLuc/llama-swap-cuda-images:stable-<date>-<tag>   (immutable)
#   ghcr.io/tayuLuc/llama-swap-cuda-images:nightly         (moving alias)
#   ghcr.io/tayuLuc/llama-swap-cuda-images:nightly-<date>-<sha>   (immutable)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which fork set to pack: stable (releases) or nightly (branch HEADs)'
        required: true
        type: choice
        options:
          - stable
          - nightly
        default: stable
  schedule:
    - cron: '17 0 * * *'   # periodic nightly rebuild
  # Branch PRs build the image (all gates, no push): the ABI/venv gates run on
  # real fetched binaries, which no local check can do without a GPU base.
  pull_request:

permissions:
  contents: write     # create git tags / releases for build audit
  packages: write     # push to GHCR

env:
  IMAGE: ghcr.io/tayuluc/llama-swap-cuda-images

jobs:
  build-image:
    runs-on: ubuntu-latest
    # PRs build BOTH modes: the nightly empty-lane chain (select skip -> fetch
    # stub -> empty-dir COPY -> gate skip) is exactly the code a stable-only PR
    # build never exercises, and before this matrix its only coverage was the
    # 00:17 cron running in production. One empty matrix row for every other
    # event keeps dispatch/schedule at their resolved single mode.
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ github.event_name == 'pull_request' && fromJSON('["stable", "nightly"]') || fromJSON('[""]') }}
    name: build-image (${{ matrix.mode || 'auto' }})
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve mode. A dispatch with an empty `mode` input used to fall through
      # to nightly, so a manual run that looked like "stable" in the form (the
      # form shows the default) landed in the nightly branch, which needs a
      # nightly tag for every lane - run 293 died exactly there. Now: explicit
      # input wins, schedule is nightly, a manual dispatch defaults to stable.
      - name: Resolve mode
        id: mode
        run: |
          MX="${{ matrix.mode }}"
          IN="${{ github.event.inputs.mode }}"
          EV="${{ github.event_name }}"
          if [ -n "$MX" ]; then
            # pull_request matrix: both modes, see strategy.
            M="$MX"
          elif [ -n "$IN" ]; then
            M="$IN"
          elif [ "$EV" = "schedule" ]; then
            M=nightly
          else
            M=stable
          fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"
          echo "resolved mode: matrix='$MX' input='$IN' event='$EV' -> $M"

      # Compute immutable tag (shell-expanded date + run id).
      - name: Compute tags
        id: tags-calc
        run: |
          DATE=$(date -u +%Y%m%d)
          echo "moving=${{ steps.mode.outputs.mode }}" >> "$GITHUB_OUTPUT"
          echo "immutable=${{ steps.mode.outputs.mode }}-${DATE}-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      # Capture which fork tags we are packing (for the audit release notes).
      # Uses GITHUB_TOKEN to avoid unauthenticated API rate limits.
      - name: Capture packed fork tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          export SELECT_ASSETS_FILE="$RUNNER_TEMP/selected-assets.tsv"
          # Same script the fetcher stage runs inside the image build. The second
          # copy of this logic that used to live here still read a single page of
          # releases, which is how the notes and the packed contents drifted apart.
          # The lane list comes from the fetcher's own table (--print-lanes): a
          # repo rename edits BACKENDS once, fingerprint and download cannot drift.
          LANES=$(bash scripts/fetch-binaries.sh --print-lanes | tr '\n' ' ')
          bash scripts/select-releases.sh "$MODE" $LANES \
            | awk '{ printf "%s: %s\n", $1, ($2 == "" ? "MISSING" : $2) }' | tee tags.txt
          {
            echo "packed<<EOF"
            cat tags.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # The fetcher stage's RUN layer is cached by buildx on (base image,
          # COPYed scripts, BUILD_MODE). Upstream release CONTENT is not part of
          # that key, so a run that selects a NEWER release reuses the previous
          # run's downloaded binaries verbatim and the audit body then describes a
          # selection the image does not contain. Measured on 24.11: run 298
          # (16:06:38Z -> 16:07:09Z, 31 s, all steps success) published
          # stable-20261124-45433260900 whose linux/amd64 image config digest
          # sha256:46deaa9865b5e64... is byte-identical to run 297's, while its
          # body listed infernix-f9c2e42cb3e9 (published 16:06:19Z) - the packed
          # Infernix was still infernix-49893d9cfb45. Key the fetch layer on the
          # selection fingerprint so the cache dies exactly when the selection moves.
          # Asset ids and sizes join the fingerprint (SELECT_ASSETS_FILE): the forks
          # repo republishes a release for an unchanged commit sha - run 163 put an
          # ubuntu24.04 asset (569667644 B) under infernix-f9c2e42cb3e9, which tags.txt
          # already carried from run 161's ffmpeg-8 asset (570635562 B) - so tags alone
          # keep the key identical and buildx serves the stale download layer.
                    # "|| true" on the assets leg: an empty assets file makes the [ -s ]
          # test fail as the brace group's last command, and pipefail+set -e
          # would kill the step with a bare rc 1 under an unhelpful sha256sum line.
          SHA=$( { sha256sum tags.txt; { [ -s "$SELECT_ASSETS_FILE" ] && sha256sum "$SELECT_ASSETS_FILE"; } || true; } | sha256sum | cut -c1-16)
          echo "selection-key=$SHA" >> "$GITHUB_OUTPUT"
          echo "selection-key=$SHA (fingerprint of the selected release tags and asset identities)"
          echo "asset identities used:"; cat "$SELECT_ASSETS_FILE" 2>/dev/null || echo "  (none)"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          # PR builds prove the gates; only main/schedule runs move tags.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_MODE=${{ steps.mode.outputs.mode }}
            SELECTION_KEY=${{ steps.tags.outputs.selection-key }}
            CUDA_TAG=13.4.2-cudnn-runtime-ubuntu26.04@sha256:44d81ee374c0c00192935010483c5f5fadf47941fe09ead0f0ad48d5c09cc611
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags-calc.outputs.moving }}
            ${{ env.IMAGE }}:${{ steps.tags-calc.outputs.immutable }}
          cache-from: type=gha
          # PRs read main's cache (cache-from) and write only their own final
          # layers: a mode=max export per PR matrix job evicts the 10 GB shared
          # quota, and the next main build re-downloads every release tarball.
          cache-to: ${{ github.event_name == 'pull_request' && 'type=gha,mode=min' || 'type=gha,mode=max' }}

      - name: Create audit release (git tag + notes)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          TAG="${MODE}-$(date -u +%Y%m%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "llama-swap image $TAG" \
            --notes "CUDA 13.4 llama-swap image (mode=$MODE), engines packed:

          ${{ steps.tags.outputs.packed }}
          Image: ${{ env.IMAGE }}:$TAG" \
            $( [ "$MODE" = "nightly" ] && echo "--prerelease" )
