# Keeps the audit-release list from refilling.
#
# The image workflow mints a release per build and the tag embeds the run id
# (nightly-20261009-37892188710), so every run creates a new release even when
# the image is byte-identical. Two triggers fire - the 00:17 schedule and the
# dispatch from yet-another's trigger-swap - which is how this reached 165
# releases in three months.
#
# Nothing is lost by deleting them: all 165 carried zero assets, they are audit
# records only, and the real artifacts live in ghcr.io under the moving
# `stable`/`nightly` aliases plus immutable `stable-<date>-<tag>` tags.

name: Prune audit releases

on:
  schedule:
    # 06:20 UTC - after both build triggers have run for the day.
    - cron: '20 6 * * *'
  workflow_dispatch:
    inputs:
      keep_stable:
        description: stable releases to keep
        default: '1'
        type: string
      keep_nightly:
        description: nightly releases to keep
        default: '1'
        type: string

permissions:
  contents: write

concurrency:
  group: prune-audit-releases
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/prune-releases.sh --apply \
            "${{ github.event.inputs.keep_stable || '1' }}" \
            "${{ github.event.inputs.keep_nightly || '1' }}"